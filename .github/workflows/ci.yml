name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tests_hub benchmarks examples

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

  # The statistical claims are the product, so the suite that checks them by
  # simulation runs on its own and is allowed to be slow.
  error-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: False-flag rate on a build where nothing changed
        run: |
          arbiter simulate --trials 40 --tasks 20 --regressed 0 \
            --max-replicates 150 --json null.json
          python - <<'PY'
          import json, sys
          result = json.load(open("null.json"))
          print(f"false discovery rate: {result['fdr']:.4f}")
          print(f"trials with any false flag: {result['any_false_flag_rate']:.4f}")
          if result["fdr"] > 0.15:
              sys.exit(f"FDR {result['fdr']:.3f} is far above the 0.05 bound")
          PY

      - name: Detection rate on a build with real regressions
        run: |
          arbiter simulate --trials 40 --tasks 20 --regressed 3 \
            --max-replicates 150 --json alt.json
          python - <<'PY'
          import json, sys
          result = json.load(open("alt.json"))
          print(f"builds blocked: {result['detection_rate']:.4f}")
          if result["detection_rate"] < 0.80:
              sys.exit(f"detection rate {result['detection_rate']:.3f} is too low")
          PY

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: The example suite should find its planted regression
        run: |
          set +e
          arbiter gate examples/suite.yaml --json result.json --quiet
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (regressions found), got $code"
            exit 1
          fi
          python - <<'PY'
          import json, sys
          result = json.load(open("result.json"))
          flagged = {t["task_id"] for t in result["tasks"] if t["flagged"]}
          print("flagged:", sorted(flagged))
          # The target is deterministic given the seed, so this is an exact
          # expectation rather than a tolerance. ceo_tenure and revenue_per_head
          # need two facts; current_ceo needs one but its top two passages tie on
          # retrieval score, so truncating to one breaks it too.
          must_flag = {"ceo_tenure", "revenue_per_head", "current_ceo"}
          must_not_flag = {"founded_year", "headquarters_move", "revenue_2023"}
          missing = must_flag - flagged
          if missing:
              sys.exit(f"these regressions were not found: {sorted(missing)}")
          wrong = flagged & must_not_flag
          if wrong:
              sys.exit(f"unaffected tasks were flagged in error: {sorted(wrong)}")
          PY

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      # Exercises the two halves against each other: the hub accepts a real
      # gate result, and `arbiter gate --publish` is what sends it. Mocking
      # either side would test the mock.
      - name: The gate publishes to the hub end to end
        run: |
          set -e
          export ARBITER_HUB_DATABASE_URL="sqlite:///$PWD/ci.sqlite"
          export ARBITER_HUB_BASE_URL="http://127.0.0.1:8099"
          export ARBITER_HUB_DEV_AUTH=1

          TOKEN=$(arbiter-hub demo --runs 3 | sed -n 's/^ARBITER_HUB_TOKEN=//p')
          if [ -z "$TOKEN" ]; then echo "demo did not mint a token"; exit 1; fi

          arbiter-hub serve --port 8099 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8099/health

          # The example suite contains a planted regression, so this exits 1.
          set +e
          arbiter gate examples/suite.yaml --quiet             --publish http://127.0.0.1:8099 --publish-token "$TOKEN"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected the gate to exit 1 (regressions found), got $code"
            exit 1
          fi

          curl -sf http://127.0.0.1:8099/api/v1/runs/4             -H "Authorization: Bearer $TOKEN" -o published.json
          python - <<'PY'
          import json, sys
          run = json.load(open("published.json"))
          flagged = sorted(t["task_id"] for t in run["tasks"] if t["flagged"])
          print("verdict:", run["verdict"], "flagged:", flagged)
          if run["verdict"] != "fail":
              sys.exit(f"expected a failing verdict, got {run['verdict']}")
          if "ceo_tenure" not in flagged:
              sys.exit("the published run lost its flagged tasks")
          PY

      - name: A hub that is down must not fail the build
        run: |
          set +e
          arbiter gate examples/suite.yaml --quiet             --publish http://127.0.0.1:1 --publish-token arb_unreachable
          code=$?
          set -e
          # 1 means "regressions found", which is the gate's own verdict. Any
          # other code would mean the unreachable hub changed the outcome.
          if [ "$code" -ne 1 ]; then
            echo "an unreachable hub changed the exit code to $code"
            exit 1
          fi
