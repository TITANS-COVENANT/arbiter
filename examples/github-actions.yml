# Drop this in .github/workflows/eval-gate.yml.
#
# The one line that matters most is the cache step. Without it every run
# re-executes the baseline from scratch, which roughly doubles the bill and buys
# nothing: a pull request changes the candidate, not the baseline.
name: eval gate

on:
  pull_request:
    paths:
      - "src/**"
      - "prompts/**"
      - "evals/**"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "arbiter-eval @ git+https://github.com/TITANS-COVENANT/arbiter"
          pip install -e .

      # Restore the run store. The key deliberately excludes the source tree:
      # the cache is keyed on the *suite* so that baseline runs survive a change
      # to the candidate. arbiter hashes the target definition itself and stops
      # reusing runs when the baseline build actually changes.
      - name: Restore run store
        uses: actions/cache@v6
        with:
          path: .arbiter
          key: arbiter-${{ hashFiles('evals/suite.yaml') }}-${{ github.run_id }}
          restore-keys: |
            arbiter-${{ hashFiles('evals/suite.yaml') }}-
            arbiter-

      - name: Size the run
        run: arbiter plan --tasks 120 --baseline-rate 0.9 --mde 0.15 --cost 0.03

      - name: Run the gate
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          arbiter gate evals/suite.yaml \
            --store .arbiter/runs.sqlite \
            --markdown report.md \
            --junit arbiter-junit.xml \
            --json arbiter-result.json

      # Runs even on failure, which is the case you most want the artefacts for.
      - name: Job summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- arbiter -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = { ...context.repo, body: marker + '\n' + body };
            if (existing) {
              await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
            }

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arbiter
          path: |
            arbiter-result.json
            arbiter-junit.xml
            report.md

      # Explain the failure rather than leaving a bare red X. Exit code 2 means
      # the harness could not reach the target, which is a different problem from
      # a regression and wants a different person looking at it.
      - name: Explain a harness failure
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("arbiter-result.json")
          if not path.exists():
              print("::error::the gate did not produce a result; check the install step")
              raise SystemExit(0)
          result = json.loads(path.read_text())
          if result["verdict"] == "error":
              print("::error::the gate could not run reliably, so the verdict means nothing")
              for note in result["notes"]:
                  print(f"::error::{note}")
          else:
              for task in result["tasks"]:
                  if task["flagged"]:
                      print(
                          f"::error title=eval regression::{task['task_id']}: "
                          f"{task['baseline_rate']:.0%} -> {task['candidate_rate']:.0%} "
                          f"over {task['replicates']} paired replicates"
                      )
          PY
