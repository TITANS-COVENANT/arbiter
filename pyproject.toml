[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arbiter-eval"
version = "0.1.0"
description = "A statistical CI gate for noisy agent evals: sequential tests, paired comparison, and FDR control."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TITANS-COVENANT" }]
keywords = ["llm", "agents", "evaluation", "ci", "sequential-testing", "flaky-tests", "e-values"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.3",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "arbiter-eval[web]",
]

[project.scripts]
arbiter = "arbiter.cli:app"
arbiter-hub = "arbiter_hub.cli:app"

[project.urls]
Homepage = "https://github.com/TITANS-COVENANT/arbiter"
Issues = "https://github.com/TITANS-COVENANT/arbiter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arbiter", "src/arbiter_hub"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_hub"]
asyncio_mode = "auto"
filterwarnings = [
  # Our own deprecations are errors, deliberately.
  "error::DeprecationWarning",
  # Starlette's TestClient touches a deprecated anyio alias at import time.
  # Not ours to fix, and not worth weakening the rule above for.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["arbiter", "arbiter_hub"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
